  <ellipse cx="160" cy="220" rx="90" ry="75" fill="url(#snow)"/>
  <!-- oversized round head -->
  <path d="M62 141C62 78 104 53 160 53s98 25 98 88c0 58-37 100-98 100S62 199 62 141Z" fill="url(#snow)"/>
 </g>
 <!-- signature deliberately simple, tiny dot features and playful mouth -->
