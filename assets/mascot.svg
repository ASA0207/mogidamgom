<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-label="하얗고 둥근 농담곰 스타일 마스코트">
 <defs>
  <radialGradient id="snow" cx="35%" cy="26%" r="90%"><stop stop-color="#fff"/><stop offset=".7" stop-color="#fffdfd"/><stop offset="1" stop-color="#e9e5f3"/></radialGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#19203e" flood-opacity=".20"/></filter>
 </defs>
 <g filter="url(#shadow)" stroke="#322d38" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
